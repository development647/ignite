name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main, master]

permissions:
  pull-requests: read

jobs:
  semantic-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The PR title must start with a lowercase letter after the type/scope.
            Example: "feat(sequencer): add per-step probability"
